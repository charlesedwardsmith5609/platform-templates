# Checkov configuration for platform-templates IaC.
# Soften a few checks that are intentionally org-specific or example-only.

compact: true
framework:
  - terraform
  - github_actions

skip-check:
  # NetworkPolicy allows all egress by default so arbitrary upstream ports work;
  # module README documents tightening before production.
  - CKV2_K8S_6
  # Service onboarding is intentionally parameterized via workflow_dispatch inputs.
  - CKV_GHA_7
  # examples/floci-aws Secrets Manager fixture is local-only; CMK + rotation are
  # not under test (Floci apply covers create/get/destroy of the secret path).
  - CKV_AWS_149
  - CKV2_AWS_57

soft-fail: false
download-external-modules: false
