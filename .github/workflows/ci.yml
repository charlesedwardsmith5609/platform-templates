name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt, validate & test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive terraform examples

      - name: Validate module
        working-directory: terraform/modules/api-gateway
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate example composition
        working-directory: examples/api-gateway
        run: |
          terraform init -backend=false
          terraform validate

      - name: Render gateway templates
        working-directory: examples/template-render
        run: |
          terraform init -backend=false
          terraform apply -auto-approve -input=false
          terraform output -raw envoy | grep -q 'address: 127.0.0.1'
          terraform output -raw envoy | grep -q 'cart-service.checkout.svc.cluster.local'
          terraform output -raw otel | grep -q 'insecure: true'

      - name: Terraform test
        working-directory: terraform/modules/api-gateway
        run: terraform test

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: Init plugins
        run: tflint --init

      - name: Lint api-gateway module
        working-directory: terraform/modules/api-gateway
        run: tflint --format compact --recursive

      - name: Lint examples
        working-directory: examples/api-gateway
        run: tflint --format compact --chdir .

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yml
          output_format: cli
          soft_fail: false

  workflow-lint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # Separate from fmt/validate/TFLint/Checkov so Floci limitations cannot block those jobs.
  floci-apply:
    name: Floci apply (AWS-only)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -qo /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi
          aws --version

      - name: Floci apply / destroy
        run: ./scripts/test-floci.sh
