name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  terraform:
    name: Terraform fmt, validate & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive terraform examples

      - name: Validate module
        working-directory: terraform/modules/api-gateway
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate example composition
        working-directory: examples/api-gateway
        run: |
          terraform init -backend=false
          terraform validate

      - name: Render gateway templates
        working-directory: examples/template-render
        run: |
          terraform init -backend=false
          terraform apply -auto-approve -input=false
          terraform output -raw envoy | grep -q 'address: 127.0.0.1'
          terraform output -raw envoy | grep -q 'cart-service.checkout.svc.cluster.local'
          terraform output -raw otel | grep -q 'insecure: true'

      - name: Terraform test
        working-directory: terraform/modules/api-gateway
        run: terraform test

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: terraform-linters/setup-tflint@8093687ecc9dcbfa88d07c103ad4176739a7287e # v4.1.0
        with:
          tflint_version: v0.54.0

      - name: Init plugins
        run: tflint --init

      - name: Lint api-gateway module
        working-directory: terraform/modules/api-gateway
        run: tflint --format compact --recursive

      - name: Lint examples
        working-directory: examples/api-gateway
        run: tflint --format compact --chdir .

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@ceeeb0f3290d3f95a8707b3f36a83379e5f21aaf # v12.2954.0
        with:
          directory: .
          config_file: .checkov.yml
          output_format: cli
          soft_fail: false

  workflow-lint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run actionlint
        run: |
          # v1.7.12. The installer script is pinned to the commit that sets that version.
          bash <(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/3795ba2f6cb243eeca54c9d22e5c531cb9dcfb4a/scripts/download-actionlint.bash) \
            1.7.12
          ./actionlint -color

  action-pins:
    name: Action SHA pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit test pin checker
        run: ./scripts/test-check-action-pins.sh
      - name: Check workflow action pins
        run: ./scripts/check-action-pins.sh

  # Separate from fmt/validate/TFLint/Checkov so Floci limitations cannot block those jobs.
  floci-apply:
    name: Floci apply (AWS-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -qo /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi
          aws --version

      - name: Floci apply / destroy
        run: ./scripts/test-floci.sh
