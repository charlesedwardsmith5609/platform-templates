# Reusable deploy workflow: GitHub OIDC → AWS STS → Secrets Manager → Kubernetes Secret.
#
# Prefer External Secrets Operator / Secrets Store CSI for continuous sync.
# This workflow is for deploy-time injection when ESO is not yet available.
#
# Required repo secrets:
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION
# Optional:
#   EKS_CLUSTER_NAME (defaults to platform-<environment>)

name: Deploy with OIDC Secrets Injection

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (maps to GitHub Environment + secret path)
        type: string
        required: true
      service_name:
        description: Service / deployment name
        type: string
        required: true
      namespace:
        description: Kubernetes namespace (defaults to service_name)
        type: string
        required: false
        default: ""
      secret_id:
        description: Secrets Manager secret id (defaults to platform/<env>/<service>/config)
        type: string
        required: false
        default: ""
      eks_cluster_name:
        description: EKS cluster name for kubeconfig
        type: string
        required: false
        default: ""
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true
      AWS_REGION:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SERVICE_NAME: ${{ inputs.service_name }}
      ENVIRONMENT: ${{ inputs.environment }}
      NAMESPACE: ${{ inputs.namespace != '' && inputs.namespace || inputs.service_name }}
      SECRET_ID: ${{ inputs.secret_id != '' && inputs.secret_id || format('platform/{0}/{1}/config', inputs.environment, inputs.service_name) }}
      EKS_CLUSTER_NAME: ${{ inputs.eks_cluster_name != '' && inputs.eks_cluster_name || format('platform-{0}', inputs.environment) }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ${{ inputs.service_name }}-deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Sync Secrets Manager bundle to a Kubernetes Secret
        id: sync-secret
        run: |
          set -euo pipefail

          # Pipe SecretString on stdin so values are not placed in argv or $GITHUB_ENV.
          aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString \
            --output text \
          | python3 - "$SERVICE_NAME" "$NAMESPACE" <<'PY'
          import json, os, re, sys, subprocess

          service, namespace = sys.argv[1], sys.argv[2]
          raw = sys.stdin.read()
          data = json.loads(raw)
          if not isinstance(data, dict) or not data:
              raise SystemExit("secret payload must be a non-empty JSON object")

          key_re = re.compile(r"^[A-Za-z0-9_.-]+$")
          string_data = {}
          for key, value in data.items():
              if not isinstance(key, str) or not key_re.fullmatch(key):
                  raise SystemExit(f"invalid secret key: {key!r}")
              text = value if isinstance(value, str) else json.dumps(value)
              print(f"::add-mask::{text}")
              string_data[key] = text

          secret_name = f"{service}-config"
          manifest = {
              "apiVersion": "v1",
              "kind": "Secret",
              "metadata": {
                  "name": secret_name,
                  "namespace": namespace,
                  "labels": {
                      "app.kubernetes.io/name": service,
                      "platform.io/managed-by": "secrets-injection-workflow",
                  },
              },
              "type": "Opaque",
              "stringData": string_data,
          }
          subprocess.run(
              ["kubectl", "apply", "-f", "-"],
              input=json.dumps(manifest),
              text=True,
              check=True,
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"secret_name={secret_name}\n")
              fh.write(f"key_count={len(string_data)}\n")
              fh.write("keys=" + ",".join(sorted(string_data)) + "\n")
          print(f"Synced {len(string_data)} keys into secret/{secret_name} (namespace={namespace})")
          PY

      - name: Roll out deployment referencing the synced secret
        run: |
          set -euo pipefail
          SECRET_NAME="${{ steps.sync-secret.outputs.secret_name }}"
          KEYS="${{ steps.sync-secret.outputs.keys }}"

          # Convention: deployment and primary container share the service name.
          # Teams that prefer volume mounts can replace this step.
          kubectl patch deployment "$SERVICE_NAME" \
            --namespace "$NAMESPACE" \
            --type strategic \
            -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"$SERVICE_NAME\",\"envFrom\":[{\"secretRef\":{\"name\":\"$SECRET_NAME\"}}]}]}}}}"

          # Annotate for auditability (keys only).
          kubectl annotate deployment "$SERVICE_NAME" \
            --namespace "$NAMESPACE" \
            "platform.io/secret-keys=$KEYS" \
            "platform.io/last-secret-sync=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --overwrite

          kubectl rollout status deployment/"$SERVICE_NAME" \
            --namespace "$NAMESPACE" \
            --timeout=5m

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          kubectl wait pod \
            -l "app.kubernetes.io/name=${SERVICE_NAME}" \
            -n "$NAMESPACE" \
            --for=condition=Ready \
            --timeout=120s
          echo "${SERVICE_NAME} deployed and Ready in ${NAMESPACE}"

      - name: Emit audit event
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          event = {
              "timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "event_type": "deployment",
              "service": "${{ inputs.service_name }}",
              "environment": "${{ inputs.environment }}",
              "namespace": "${{ env.NAMESPACE }}",
              "actor": "${{ github.actor }}",
              "sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "status": "${{ job.status }}",
              "secret_id": "${{ env.SECRET_ID }}",
          }
          print(json.dumps(event, sort_keys=True))
          PY
