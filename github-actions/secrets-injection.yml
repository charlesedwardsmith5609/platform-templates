# Secrets Injection via OIDC Workload Identity
#
# Zero long-lived credentials. Each job authenticates to AWS via OIDC,
# assumes its workload role, and retrieves secrets from Secrets Manager
# at runtime. No secrets stored in GitHub.
#
# Pattern derived from the ZSM (Zodiac Secrets Manager) architecture:
#   service account → OIDC token → AWS STS AssumeRoleWithWebIdentity
#   → scoped IAM role → Secrets Manager GetSecretValue

name: Deploy with OIDC Secrets Injection

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      service_name:
        type: string
        required: true

permissions:
  id-token: write    # Required for OIDC token exchange
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      # Step 1: Exchange GitHub OIDC token for AWS credentials
      # No AWS_SECRET_ACCESS_KEY ever touches this runner
      - name: Authenticate to AWS via OIDC
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:         ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name:      ${{ inputs.service_name }}-deploy-${{ github.run_id }}
          aws-region:             ${{ secrets.AWS_REGION }}
          role-duration-seconds:  900    # 15 minutes — minimum viable session

      # Step 2: Pull secrets from Secrets Manager into env vars
      # Secrets are fetched at deploy time, never stored in git or GitHub
      - name: Inject secrets from Secrets Manager
        id: secrets
        run: |
          SERVICE="${{ inputs.service_name }}"
          ENV="${{ inputs.environment || 'production' }}"

          # Retrieve the secret bundle for this service/environment
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "platform/$ENV/$SERVICE/config" \
            --query SecretString \
            --output text)

          # Export each key as a masked env var
          echo "$SECRET_JSON" | python3 -c "
          import json, sys, os
          data = json.load(sys.stdin)
          for key, value in data.items():
              # Mask value from logs
              print(f'::add-mask::{value}')
              # Write to GITHUB_ENV for downstream steps
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'{key}={value}\n')
          print(f'Injected {len(data)} secrets for {\"$SERVICE\"}/{\"$ENV\"}')
          "

      # Step 3: Deploy with secrets available as env vars
      - name: Deploy to Kubernetes
        run: |
          # Secrets are now available as environment variables
          # e.g. $DATABASE_URL, $API_KEY, etc.
          echo "Deploying ${{ inputs.service_name }} to ${{ inputs.environment }}"

          # Apply Kubernetes manifests — the service reads secrets from env
          kubectl set env deployment/${{ inputs.service_name }} \
            --env-file <(env | grep -v GITHUB | grep -v RUNNER) \
            --namespace ${{ inputs.service_name }}

          kubectl rollout status deployment/${{ inputs.service_name }} \
            --namespace ${{ inputs.service_name }} \
            --timeout=5m

      # Step 4: Verify deployment health before marking success
      - name: Post-deploy health check
        run: |
          # Wait for readiness probe to pass
          kubectl wait pod \
            -l "app.kubernetes.io/name=${{ inputs.service_name }}" \
            -n "${{ inputs.service_name }}" \
            --for=condition=Ready \
            --timeout=120s

          echo "✅ ${{ inputs.service_name }} deployed and healthy"

      # Step 5: Audit log — who deployed what, when
      - name: Emit audit event
        if: always()
        run: |
          python3 - <<EOF
          import json, subprocess, datetime

          event = {
              "timestamp":     datetime.datetime.utcnow().isoformat() + "Z",
              "event_type":    "deployment",
              "service":       "${{ inputs.service_name }}",
              "environment":   "${{ inputs.environment || 'production' }}",
              "actor":         "${{ github.actor }}",
              "sha":           "${{ github.sha }}",
              "run_id":        "${{ github.run_id }}",
              "status":        "${{ job.status }}",
          }
          print(json.dumps(event))

          # In production: emit to your audit log sink (Splunk, CloudWatch, etc.)
          # subprocess.run(["aws", "logs", "put-log-events", "--log-group", "/platform/audit", ...])
          EOF
