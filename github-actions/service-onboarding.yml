# Service Onboarding Workflow Template
#
# What this does:
#   1. Validates the service manifest (required metadata, ownership, SLO targets)
#   2. Bootstraps OIDC workload identity (no long-lived credentials)
#   3. Creates namespace with standard labels
#   4. Deploys baseline observability (OTel annotations, PagerDuty routing key)
#   5. Runs smoke test to confirm deployment is healthy
#   6. Opens a PR with auto-generated runbook stub
#
# Usage:
#   Copy to .github/workflows/onboard.yml in your platform repo.
#   Trigger manually via workflow_dispatch with the inputs below,
#   or call from a service repo's own onboarding PR.
#
# Reduces service onboarding from days to hours — or less.

name: Service Onboarding

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service name (lowercase, hyphens)"
        required: true
      team_slug:
        description: "GitHub team slug that owns this service"
        required: true
      slo_target:
        description: "Availability SLO target (e.g. 0.999)"
        required: true
        default: "0.999"
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      namespace:
        description: "Kubernetes namespace (defaults to service_name)"
        required: false

  # Also callable from a service onboarding PR via repository_dispatch
  repository_dispatch:
    types: [onboard-service]

env:
  SERVICE_NAME:  ${{ github.event.inputs.service_name || github.event.client_payload.service_name }}
  TEAM_SLUG:     ${{ github.event.inputs.team_slug   || github.event.client_payload.team_slug }}
  SLO_TARGET:    ${{ github.event.inputs.slo_target  || github.event.client_payload.slo_target || '0.999' }}
  ENVIRONMENT:   ${{ github.event.inputs.environment || github.event.client_payload.environment || 'staging' }}
  NAMESPACE:     ${{ github.event.inputs.namespace   || github.event.inputs.service_name || github.event.client_payload.service_name }}

jobs:
  validate:
    name: Validate service manifest
    runs-on: ubuntu-latest
    outputs:
      service_valid: ${{ steps.validate.outputs.valid }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        id: validate
        run: |
          # Service name must be lowercase alphanumeric + hyphens
          if ! echo "$SERVICE_NAME" | grep -qE '^[a-z][a-z0-9-]{1,62}[a-z0-9]$'; then
            echo "::error::service_name '$SERVICE_NAME' is invalid. Must be lowercase alphanumeric with hyphens."
            exit 1
          fi

          # Validate SLO target range
          python3 -c "
          slo = float('$SLO_TARGET')
          assert 0.9 <= slo < 1.0, f'SLO target {slo} out of range [0.9, 1.0)'
          print(f'SLO target {slo} is valid')
          "

          echo "valid=true" >> $GITHUB_OUTPUT
          echo "✅ Service '$SERVICE_NAME' passed validation"

  bootstrap-identity:
    name: Bootstrap OIDC workload identity
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.service_valid == 'true'
    permissions:
      id-token: write   # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLATFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create Kubernetes service account with IAM role binding
        run: |
          # Create namespace if it doesn't exist
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # Label namespace with standard platform metadata
          kubectl label namespace "$NAMESPACE" \
            "platform.io/team=$TEAM_SLUG" \
            "platform.io/service=$SERVICE_NAME" \
            "platform.io/slo-target=$SLO_TARGET" \
            --overwrite

          # Create service account with OIDC annotation
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: $SERVICE_NAME
            namespace: $NAMESPACE
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/$SERVICE_NAME-workload
            labels:
              app.kubernetes.io/name: $SERVICE_NAME
              platform.io/managed-by: onboarding-workflow
          EOF

          echo "✅ OIDC workload identity configured for $SERVICE_NAME"

  bootstrap-observability:
    name: Bootstrap observability stack
    runs-on: ubuntu-latest
    needs: [validate, bootstrap-identity]
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLATFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy OTel ConfigMap and SLO alert rules
        run: |
          # OTel collector configuration for the new service
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: $SERVICE_NAME-otel-config
            namespace: $NAMESPACE
          data:
            config.yaml: |
              receivers:
                otlp:
                  protocols:
                    grpc: { endpoint: 0.0.0.0:4317 }
                    http: { endpoint: 0.0.0.0:4318 }
              processors:
                resource:
                  attributes:
                    - action: insert
                      key: service.name
                      value: $SERVICE_NAME
                    - action: insert
                      key: service.namespace
                      value: $NAMESPACE
                    - action: insert
                      key: deployment.environment
                      value: $ENVIRONMENT
              exporters:
                otlp:
                  endpoint: ${{ secrets.OTEL_EXPORTER_ENDPOINT }}
              service:
                pipelines:
                  traces:
                    receivers:  [otlp]
                    processors: [resource]
                    exporters:  [otlp]
                  metrics:
                    receivers:  [otlp]
                    processors: [resource]
                    exporters:  [otlp]
          EOF

          echo "✅ Observability stack configured for $SERVICE_NAME"

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [bootstrap-identity, bootstrap-observability]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLATFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify namespace and service account exist
        run: |
          kubectl get namespace "$NAMESPACE"
          kubectl get serviceaccount "$SERVICE_NAME" -n "$NAMESPACE"
          kubectl get configmap "$SERVICE_NAME-otel-config" -n "$NAMESPACE"
          echo "✅ Smoke test passed for $SERVICE_NAME in $NAMESPACE"

  generate-runbook:
    name: Generate runbook PR
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate runbook stub
        run: |
          mkdir -p "runbooks/$SERVICE_NAME"
          cat > "runbooks/$SERVICE_NAME/README.md" <<EOF
          # $SERVICE_NAME Runbook

          **Owner:** @$TEAM_SLUG
          **Namespace:** \`$NAMESPACE\`
          **SLO Target:** $SLO_TARGET ($(python3 -c "print(f'{float('$SLO_TARGET')*100:.3f}%')") availability)
          **Environment:** $ENVIRONMENT
          **Onboarded:** $(date -u +"%Y-%m-%d")

          ## Service overview

          <!-- TODO: Add a brief description of what $SERVICE_NAME does -->

          ## On-call contacts

          - Primary: @$TEAM_SLUG
          - Escalation: #platform-oncall (Slack)
          - PagerDuty: [service link](https://zillow.pagerduty.com/services)

          ## SLO & alerts

          SLO: $SLO_TARGET availability over a 30-day rolling window.

          Alert thresholds (auto-generated, do not edit manually):
          \`\`\`bash
          slo-toolkit alerts --slo $SLO_TARGET --service $SERVICE_NAME --format table
          \`\`\`

          ## Common incidents

          ### Elevated error rate
          1. Check recent deployments: \`kubectl rollout history deploy/$SERVICE_NAME -n $NAMESPACE\`
          2. Check error rate: Chronosphere → $SERVICE_NAME → error_rate_1h
          3. Rollback if needed: \`kubectl rollout undo deploy/$SERVICE_NAME -n $NAMESPACE\`

          ### Pod not starting
          1. \`kubectl describe pod -l app.kubernetes.io/name=$SERVICE_NAME -n $NAMESPACE\`
          2. Check resource quotas: \`kubectl describe resourcequota -n $NAMESPACE\`

          ## Dependencies

          <!-- TODO: List upstream services and datastores this service depends on -->

          ## Deployment

          This service is onboarded to the platform CI/CD pipeline.
          See [platform docs](https://platform.internal/docs/onboarding) for deployment procedures.
          EOF

          echo "✅ Runbook stub generated at runbooks/$SERVICE_NAME/README.md"

      - name: Open PR with runbook
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="onboard/$SERVICE_NAME-$(date +%Y%m%d)"
          git config user.email "platform-bot@company.internal"
          git config user.name "Platform Bot"
          git checkout -b "$BRANCH"
          git add "runbooks/$SERVICE_NAME/"
          git commit -m "chore: onboard $SERVICE_NAME — add runbook stub [skip ci]"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: onboard $SERVICE_NAME" \
            --body "Auto-generated by the service onboarding workflow.

          **Service:** \`$SERVICE_NAME\`
          **Team:** @$TEAM_SLUG
          **SLO:** $SLO_TARGET
          **Environment:** $ENVIRONMENT

          ### Checklist
          - [x] OIDC workload identity configured
          - [x] OTel ConfigMap deployed
          - [x] Namespace labelled
          - [x] Smoke test passed
          - [ ] Runbook reviewed and expanded by team
          " \
            --assignee "$TEAM_SLUG" \
            --label "platform,onboarding"
